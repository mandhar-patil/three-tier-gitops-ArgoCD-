kind: Deployment
apiVersion: apps/v1
metadata:
   name: backend
   namespace: three-tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
   metadata:
    labels:
      app: backend

   spec:
     affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: tier
                operator: In
                values:
                - backend
     containers:
      - name: backend
        image: mandhar12/three-tier-backend:1.0
        ports:
         - containerPort: 3500
        env: 
         - name: MONGO_CONN_STR
           valueFrom:
             secretKeyRef:
              name: mongo-secret
              key: MONGO_CONN_STR
         - name: port
           value: "3500"

 
